[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tempo"
version = "0.1.0"
description = "Time-aware AI runtime that picks the fastest answer path that is still right, at the lowest cost."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
demo = [
    "streamlit>=1.46",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff==0.6.9",
]

[tool.setuptools.packages.find]
include = ["tempo*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tempo/dashboard/app.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a real Postgres with pgvector, pgvectorscale and TimescaleDB (DATABASE_URL)",
]
addopts = "-ra"
