name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run, so feedback stays fast.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Pytest (no network, no secrets)
        run: pytest -m "not integration" --cov=tempo --cov-report=term-missing --cov-report=xml
      - name: Boot the API with uvicorn and hit it
        run: |
          uvicorn tempo.api.main:app --port 8000 &
          for i in $(seq 1 20); do curl -fsS localhost:8000/health && break; sleep 0.5; done
          curl -fsS -X POST localhost:8000/ask -H 'content-type: application/json' \
            -d '{"text": "smoke test", "deadline_ms": 2000}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests (pgvector + pgvectorscale + TimescaleDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same extensions as a Tiger Cloud service.
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Apply db/schema.sql if it exists
        run: |
          if [ -f db/schema.sql ]; then
            sudo apt-get install -y -qq postgresql-client >/dev/null
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
          else
            echo "No db/schema.sql yet, skipping"
          fi
      - run: pytest -m integration

  docker:
    name: Docker build and run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tempo:ci .
      - name: Run container and check it answers
        run: |
          docker run -d --name tempo -p 8000:8000 tempo:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/health
      - name: Container logs on failure
        if: failure()
        run: docker logs tempo

  publish:
    name: Publish image to GitHub Container Registry
    # CD: every green push to main ships a runnable image.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, unit-tests, integration-tests, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
          echo "Published $IMAGE:latest and $IMAGE:${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
